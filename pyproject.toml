[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-auditor"
version = "2.4.1"
description = "Deterministic verification and evidence auditing for AI coding agents: sealed plans, hash-chained evidence, and an independent completion gate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Furox-Art" }]
keywords = [
  "ai-agents",
  "coding-agents",
  "llm-agents",
  "agent-skills",
  "ai-verification",
  "verification",
  "auditing",
  "quality-assurance",
  "software-testing",
  "test-automation",
  "ci",
  "ci-cd",
  "continuous-integration",
  "formal-verification",
  "formal-methods",
  "strips",
  "pddl",
  "model-checking",
  "static-analysis",
  "evidence",
  "provenance",
  "audit-log",
  "tamper-evident",
  "supply-chain-security",
  "plan-execution",
  "completion-gate",
  "hallucination-detection",
  "trust-but-verify",
  "developer-tools",
  "cli",
  "supervisor",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Software Distribution",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
plan-auditor = "supervisor.cli:entrypoint"
plan-auditor-migrate-seal = "supervisor.seal_migration:main"
plan-auditor-formal = "supervisor.formal_planning:main"
plan-auditor-formalize = "supervisor.formal_compiler:main"

[project.urls]
Homepage = "https://github.com/Furox-Art/plan-auditor"
Repository = "https://github.com/Furox-Art/plan-auditor"
Issues = "https://github.com/Furox-Art/plan-auditor/issues"
Documentation = "https://github.com/Furox-Art/plan-auditor/tree/main/docs"
Changelog = "https://github.com/Furox-Art/plan-auditor/blob/main/CHANGELOG.md"
Security = "https://github.com/Furox-Art/plan-auditor/blob/main/SECURITY.md"
Contributing = "https://github.com/Furox-Art/plan-auditor/blob/main/CONTRIBUTING.md"
Citation = "https://github.com/Furox-Art/plan-auditor/blob/main/CITATION.cff"

[tool.hatch.build.targets.wheel]
packages = ["supervisor", "scripts"]
# The README tells users to copy SKILL.md, hooks/, references/ and the npm
# launcher into their host's skills directory, and docs/cli.md documents running
# hooks/gate_hook.py directly. A wheel that omitted them would install a CLI
# whose documented integration path is broken, so they ship under a single
# namespace directory rather than loose at the site-packages root.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "plan_auditor_skill/SKILL.md"
"index.js" = "plan_auditor_skill/index.js"
"package.json" = "plan_auditor_skill/package.json"
"bin/plan-auditor.js" = "plan_auditor_skill/bin/plan-auditor.js"
"hooks/gate_hook.py" = "plan_auditor_skill/hooks/gate_hook.py"
"hooks/README.md" = "plan_auditor_skill/hooks/README.md"
"references/plan-format.md" = "plan_auditor_skill/references/plan-format.md"
"mkdocs.yml" = "plan_auditor_skill/mkdocs.yml"

[tool.hatch.build.targets.sdist]
include = [
  "supervisor/**",
  "scripts/**",
  "hooks/**",
  "tests/**",
  "docs/**",
  "examples/**",
  "references/**",
  "index.js",
  "bin/**",
  "package.json",
  "mkdocs.yml",
  "README.md",
  "SKILL.md",
  "CHANGELOG.md",
  "CITATION.cff",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
branch = true
# Coverage must measure the installed distribution, not the checkout. rootdir
# conftest.py imports and pins `supervisor`/`scripts` from site-packages before
# any test module loads, so resolving these as *packages* (rather than as
# directories under the working tree) makes coverage report the modules that
# were actually executed. Naming the source directories instead would report
# the checkout's copies as 0% covered and silently void the coverage gate.
source_pkgs = ["supervisor", "scripts"]

[tool.coverage.report]
show_missing = true
# Keep the floor in one place so the workflow and local runs cannot disagree.
fail_under = 65

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]