[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-auditor"
version = "2.1.0"
description = "Independent multi-layer verification supervisor for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Furox-Art" }]
keywords = ["ai-agents", "verification", "auditing", "cli", "supervisor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
plan-auditor = "supervisor.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Furox-Art/plan-auditor"
Repository = "https://github.com/Furox-Art/plan-auditor"
Issues = "https://github.com/Furox-Art/plan-auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["supervisor", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
  "supervisor/**",
  "scripts/**",
  "tests/**",
  "docs/**",
  "examples/**",
  "references/**",
  "README.md",
  "SKILL.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
