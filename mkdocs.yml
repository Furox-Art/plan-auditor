site_name: Plan Auditor
site_description: Deterministic verification and evidence auditing for AI coding agents, completion proofs, sealed plans, STRIPS/PDDL checks, and an independent quality-assurance gate.
repo_url: https://github.com/Furox-Art/plan-auditor
repo_name: Furox-Art/plan-auditor
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: .tmp-site
copyright: MIT licensed. Content describes main and may be ahead of the published release.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Furox-Art/plan-auditor
      name: Source on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/plan-auditor/
      name: Package on PyPI
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/plan-auditor
      name: Launcher on npm
    - icon: fontawesome/solid/fingerprint
      link: https://github.com/Furox-Art/plan-auditor/blob/main/CITATION.cff
      name: Citation metadata

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - CLI reference: cli.md
  - Concepts:
      - Architecture: architecture.md
      - Dependency graph: dependency-graph.md
      - Formal planning: formal-planning.md
  - Security:
      - Threat model: threat-model.md
      - Deployment isolation: deployment-isolation.md
  - Integrations: integrations.md
  - Release status: release-status.md
  - Evidence and claims: benchmark.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition