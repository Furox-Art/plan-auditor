site_name: Plan Auditor  
site_description: Deterministic verification and evidence auditing for AI coding agents, completion proofs, software testing, CI gates, sealed plans, STRIPS/PDDL checks, and independent quality assurance.  
repo_url: https://github.com/Furox-Art/plan-auditor  
  
theme:  
  name: material  
  palette:  
    - scheme: default  
      primary: blue  
  
nav:  
  - Home: index.md  
  - Architecture: architecture.md  
  - Formal Planning: formal-planning.md  
  - Threat Model: threat-model.md  
  - Integrations: integrations.md  
  
markdown_extensions:  
  - pymdownx.highlight  
  - pymdownx.superfences  
  - admonition 
