name: plan-audit gate

on:
  push:
  pull_request:
  workflow_dispatch:

# Default to read-only; jobs that need more opt in explicitly.
permissions:
  contents: read

concurrency:
  group: plan-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The package is installed from the checkout (not editable) and
      # rootdir conftest.py pins the suite to that installed copy, so the tests
      # exercise what would actually ship.
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-cov
      - name: Activate immutable host request contract
        run: plan-auditor request init . --file .plan-auditor/request-source.json
      - name: Validate plan schema
        run: python scripts/audit_check.py validate .
      - name: Unit test gate (explicit diagnostic)
        run: python -m pytest tests/ -q
      # The source set, branch mode and the 65% floor all live in
      # [tool.coverage.run]/[tool.coverage.report] in pyproject.toml, so the
      # workflow cannot drift away from what a local run enforces. Measured at
      # 68% on this commit; scripts/stop_gate.py (0%) and
      # supervisor/seal_migration.py (36%) are the obvious next targets.
      - name: Branch coverage gate (no-regression floor)
        run: python -m pytest tests/ -q --cov --cov-report=term-missing
      # Generate the machine-readable report the upload and the artifact use.
      - name: Generate the Codecov report
        run: python -m pytest tests/ -q --cov --cov-report=xml:coverage.xml
      # This step previously pointed at ./coverage.xml, which no coverage run
      # produced, and set fail_ci_if_error: false, so every upload failed
      # silently while the badge stayed "unknown".
      #
      # The repository has no CODECOV_TOKEN secret (`gh secret list` shows only
      # NPM_TOKEN) and tokenless upload is rejected for pushes to a protected
      # branch. Rather than fail every run on a missing third-party credential
      # or silently swallow the failure, the upload is skipped with an explicit
      # warning when the secret is absent, and strictly enforced when present.
      # The report is always uploaded as an artifact either way, so the
      # measurement is never lost. Add the secret to enable the upload.
      #
      # The secret is resolved in a step and passed through `env`: the `secrets`
      # context is not available in a step-level `if`, and referencing it there
      # invalidates the whole workflow file rather than failing one step.
      - name: Detect whether Codecov upload is configured
        id: codecov
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CODECOV_TOKEN is not configured, so coverage was measured but not published."
            echo "::warning::coverage.xml is still available as the coverage-report job artifact."
          fi
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload the coverage report as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
      - name: Fib example gate (explicit diagnostic)
        run: python -m pytest examples/fib/test_fib.py -q
      - name: Verify and seal plan
        run: plan-auditor plan verify .
      - name: Integrated independent audit (dogfood final gate)
        run: plan-auditor audit .
      - name: Installed CLI health smoke test
        shell: bash
        run: |
          set -euo pipefail
          plan-auditor --help
          plan-auditor doctor . > /tmp/plan-auditor-doctor.json
          cat /tmp/plan-auditor-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/plan-auditor-doctor.json').read_text(encoding='utf-8'))
          outcome = data.get('assessment', {}).get('outcome')
          if outcome != 'PASS':
              raise SystemExit(f'ERROR: doctor assessment is {outcome!r}, expected PASS')
          PY
          plan-auditor task list .
          plan-auditor agents list .
          plan-auditor evidence verify .

  supervisor-runtime:
    name: supervisor-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package and audit dependency
        run: python -m pip install . pytest
      - name: Activate immutable host request contract
        run: plan-auditor request init . --file .plan-auditor/request-source.json
      - name: Prepare sealed and audited workspace
        run: |
          plan-auditor plan verify .
          plan-auditor audit .
      - name: Start real background supervisor
        run: plan-auditor supervisor start --profile standard --mode serial .
      - name: Require running supervisor with PASS assessment
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          last = None
          for _ in range(30):
              proc = subprocess.run(
                  ['plan-auditor', 'supervisor', 'status', '.'],
                  text=True,
                  capture_output=True,
              )
              if proc.stdout.strip():
                  try:
                      last = json.loads(proc.stdout)
                  except json.JSONDecodeError:
                      last = None
              if (
                  proc.returncode == 0
                  and isinstance(last, dict)
                  and last.get('running') is True
                  and (last.get('assessment') or {}).get('outcome') == 'PASS'
              ):
                  print(json.dumps(last, indent=2))
                  raise SystemExit(0)
              time.sleep(0.2)

          print(json.dumps(last, indent=2) if isinstance(last, dict) else 'no valid status JSON')
          raise SystemExit('ERROR: supervisor never reached running + PASS assessment')
          PY
      - name: Stop supervisor cleanly
        run: plan-auditor supervisor stop .
      - name: Require stopped status
        shell: bash
        run: |
          if plan-auditor supervisor status .; then
            echo "ERROR: supervisor still reports running after stop"
            exit 1
          fi
      - name: Require persisted final PASS assessment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.plan-auditor/supervisor-assessment.json')
          if not path.exists():
              raise SystemExit('ERROR: supervisor assessment file is missing')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('outcome') != 'PASS':
              raise SystemExit(f"ERROR: persisted supervisor assessment is {data.get('outcome')!r}, expected PASS")
          print(json.dumps(data, indent=2))
          PY
      - name: Evidence anchor check
        run: plan-auditor evidence verify .

  python-compat:
    name: python-compat (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    # ubuntu only, deliberately. Windows/macOS are covered by wheel-cli-smoke,
    # which builds and installs a real wheel on all three. Running the *unit*
    # suite on Windows additionally exposes a pre-existing race in the agent
    # registry write lock (test_runtime_root_hardening.py::
    # test_concurrent_heartbeat_and_ownership_preserve_each_other, which fails
    # roughly 1 run in 12 on Windows at 0dabcae). Widening this matrix is worth
    # doing once that race is fixed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run full regression suite
        run: python -m pytest tests/ -q
      - name: Run Fibonacci regression
        run: python -m pytest examples/fib/test_fib.py -q