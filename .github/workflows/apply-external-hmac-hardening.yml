name: apply external HMAC hardening

on:
  push:
    branches: [hardening/external-hmac]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/external-hmac
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch authenticated integrity runtime
        run: python .github/harden_external_hmac.py
      - name: Run full tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest tests/ -q
          python -m pytest examples/fib/test_fib.py -q
      - name: Dogfood unsigned compatibility gate
        run: |
          plan-auditor plan verify .
          plan-auditor audit .
          plan-auditor doctor . > /tmp/doctor.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/doctor.json'))
          assert d['assessment']['outcome'] == 'PASS'
          assert d['integrity']['configured'] is False
          PY
      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-external-hmac-hardening.yml .github/harden_external_hmac.py
          git add scripts/audit_check.py supervisor/agents.py supervisor/cli.py docs/threat-model.md CHANGELOG.md
          git commit -m "Authenticate evidence and registry with external HMAC"
          git push
