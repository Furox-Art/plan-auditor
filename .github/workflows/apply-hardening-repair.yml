name: Apply final hardening repair

on:
  push:
    branches:
      - hardening/full-verification-contract
    paths:
      - "scripts/repair_hardening.py"
      - ".github/workflows/apply-hardening-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/full-verification-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply repair
        run: python scripts/repair_hardening.py
      - name: Run tests
        run: |
          python -m pip install -e . pytest
          python -m pytest tests/test_audit_check.py tests/test_full_hardening.py -q
          python -m pytest tests/ -q
      - name: Commit repaired sources
        run: |
          git config user.name "plan-auditor-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_check.py tests/wheel_cli_smoke.py tests/test_audit_check.py
          git commit -m "Make full audits observational across multi-plan workspaces"
          git push origin HEAD:hardening/full-verification-contract
