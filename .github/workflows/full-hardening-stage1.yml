name: full hardening stage 1

on:
  push:
    branches:
      - hardening/full-root-fixes

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Normalize patch driver
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_full_hardening_stage1.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(\n    ".github/workflows/release.yml",\n    "uses: pypa/gh-action-pypi-publish@release/v1",\n    "uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33",\n)\n# There are two publish uses; pin the second too if still present.\n'''
          if old not in text:
              raise SystemExit('expected release pin patch block not found')
          path.write_text(text.replace(old, '# Pin both publish uses.\n', 1), encoding='utf-8')
          PY
      - name: Apply hardening patch
        run: python tools/apply_full_hardening_stage1.py
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build
      - name: Full regression suite
        run: python -m pytest tests/ -q
      - name: Fibonacci regression
        run: python -m pytest examples/fib/test_fib.py -q
      - name: Dogfood secure request contract
        run: |
          rm -f .plan-auditor/request.json .plan-auditor/activation.json .plan-auditor/seal.json .plan-auditor/evidence.jsonl .plan-auditor/evidence.head.json
          rm -rf .plan-auditor/archive .plan-auditor/agents
          plan-auditor request init . --file .plan-auditor/request-source.json
          plan-auditor validate .
          plan-auditor plan verify .
          plan-auditor audit .
          plan-auditor doctor . > /tmp/doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/doctor.json').read_text(encoding='utf-8'))
          assert data['assessment']['outcome'] == 'PASS', data
          PY
      - name: Build distributions
        run: python -m build
      - name: Remove one-shot tooling and commit verified changes
        run: |
          git rm -f tools/apply_full_hardening_stage1.py .github/workflows/full-hardening-stage1.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden request contract and verification roots'
          git push origin HEAD:hardening/full-root-fixes
