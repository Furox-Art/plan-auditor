name: full hardening stage 1

on:
  push:
    branches:
      - hardening/full-root-fixes

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Normalize patch drivers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_full_hardening_stage1.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(\n    ".github/workflows/release.yml",\n    "uses: pypa/gh-action-pypi-publish@release/v1",\n    "uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33",\n)\n# There are two publish uses; pin the second too if still present.\n'''
          if old not in text:
              raise SystemExit('expected release pin patch block not found')
          text = text.replace(old, '# Pin both publish uses.\n', 1)
          bad_marker = 'replace_between("scripts/plan_graph.py", "def validate_output_links(\\n", "def graph_summary(\\n", new_validate_links)'
          good_marker = 'replace_between("scripts/plan_graph.py", "def validate_output_links(\\n", "def graph_summary(", new_validate_links)'
          if bad_marker not in text:
              raise SystemExit('expected graph-summary patch marker not found')
          text = text.replace(bad_marker, good_marker, 1)
          ambiguous = 'replace_once("supervisor/cli.py", old_verify_start, new_verify_start)'
          scoped = '''text = read("supervisor/cli.py")\nverify_pos = text.find("def cmd_plan_verify")\ntarget_pos = text.find(old_verify_start, verify_pos)\nif verify_pos < 0 or target_pos < 0:\n    raise RuntimeError("cli plan-verify patch marker missing")\nwrite("supervisor/cli.py", text[:target_pos] + new_verify_start + text[target_pos + len(old_verify_start):])'''
          if ambiguous not in text:
              raise SystemExit('expected ambiguous cli replacement not found')
          text = text.replace(ambiguous, scoped, 1)
          path.write_text(text, encoding='utf-8')

          follow = Path('tools/apply_stage1_followup.py')
          follow_text = follow.read_text(encoding='utf-8')
          ambiguous_test = '''replace_once(\n    "tests/test_cli.py",\n    "    (pg / \\\"plan.json\\\").write_text(json.dumps(plan), encoding=\\\"utf-8\\\")\\n",\n    "    (pg / \\\"plan.json\\\").write_text(json.dumps(plan), encoding=\\\"utf-8\\\")\\n    activate_for_plan(tmp_path, plan)\\n",\n)'''.replace('\\\\\"', '\\"')
          if ambiguous_test not in follow_text:
              ambiguous_test = '''replace_once(\n    "tests/test_cli.py",\n    "    (pg / \\"plan.json\\").write_text(json.dumps(plan), encoding=\\"utf-8\\")\\n",\n    "    (pg / \\"plan.json\\").write_text(json.dumps(plan), encoding=\\"utf-8\\")\\n    activate_for_plan(tmp_path, plan)\\n",\n)'''
          scoped_test = '''text = read("tests/test_cli.py")\nhelper_pos = text.find("def _write_plan")\ntarget = '    (pg / "plan.json").write_text(json.dumps(plan), encoding="utf-8")\\n'\ntarget_pos = text.find(target, helper_pos)\nif helper_pos < 0 or target_pos < 0:\n    raise RuntimeError("test_cli _write_plan marker missing")\nreplacement = target + '    activate_for_plan(tmp_path, plan)\\n'\nwrite("tests/test_cli.py", text[:target_pos] + replacement + text[target_pos + len(target):])'''
          if ambiguous_test not in follow_text:
              raise SystemExit('expected ambiguous test_cli fixture replacement not found')
          follow.write_text(follow_text.replace(ambiguous_test, scoped_test, 1), encoding='utf-8')
          PY
      - name: Apply hardening patch
        run: python tools/apply_full_hardening_stage1.py
      - name: Apply request-boundary regression migration
        run: python tools/apply_stage1_followup.py
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build
      - name: Full regression suite
        run: python -m pytest tests/ -q
      - name: Fibonacci regression
        run: python -m pytest examples/fib/test_fib.py -q
      - name: Dogfood secure request contract
        run: |
          rm -f .plan-auditor/request.json .plan-auditor/activation.json .plan-auditor/seal.json .plan-auditor/evidence.jsonl .plan-auditor/evidence.head.json
          rm -rf .plan-auditor/archive .plan-auditor/agents
          plan-auditor request init . --file .plan-auditor/request-source.json
          plan-auditor validate .
          plan-auditor plan verify .
          plan-auditor audit .
          plan-auditor doctor . > /tmp/doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/doctor.json').read_text(encoding='utf-8'))
          assert data['assessment']['outcome'] == 'PASS', data
          PY
      - name: Build distributions
        run: python -m build
      - name: Commit only verified source changes
        run: |
          set -euo pipefail
          # Workflow files are patched later through the GitHub connector because
          # the Actions token intentionally has no workflow-write permission.
          git restore --source=HEAD -- .github/workflows/plan-audit.yml .github/workflows/wheel-cli-smoke.yml .github/workflows/release.yml

          # Never commit generated audit state or build artifacts.
          rm -rf dist .plan-auditor/archive .plan-auditor/agents .plan-auditor/snapshots
          rm -f .plan-auditor/request.json .plan-auditor/activation.json .plan-auditor/seal.json \
                .plan-auditor/evidence.jsonl .plan-auditor/evidence.head.json \
                .plan-auditor/supervisor-runtime.json .plan-auditor/supervisor-assessment.json

          # Dogfood execution mutates runtime status; source plans stay pending.
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.plan-auditor/plan.json')
          plan = json.loads(path.read_text(encoding='utf-8'))
          for step in plan.get('steps', []):
              if isinstance(step, dict):
                  step['status'] = 'pending'
          path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git rm -f tools/apply_full_hardening_stage1.py tools/apply_stage1_followup.py .github/workflows/full-hardening-stage1.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden request contract and verification roots'
          git push origin HEAD:hardening/full-root-fixes
