name: full hardening stage 2

on:
  push:
    branches:
      - hardening/full-root-fixes

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply runtime hardening patch
        run: python tools/apply_stage2_runtime_hardening.py
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build
      - name: Full regression suite
        run: python -m pytest tests/ -q
      - name: Fibonacci regression
        run: python -m pytest examples/fib/test_fib.py -q
      - name: Dogfood secure final audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .plan-auditor/request.json .plan-auditor/activation.json .plan-auditor/seal.json .plan-auditor/evidence.jsonl .plan-auditor/evidence.head.json .plan-auditor/integrity.json .plan-auditor/audit.freeze.lock
          rm -rf .plan-auditor/archive .plan-auditor/agents .plan-auditor/seals
          plan-auditor request init . --file .plan-auditor/request-source.json
          plan-auditor validate .
          plan-auditor plan verify .
          plan-auditor audit .
          plan-auditor doctor . > /tmp/doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/doctor.json').read_text(encoding='utf-8'))
          assert data['assessment']['outcome'] == 'PASS', data
          PY
      - name: Build distributions
        run: python -m build
      - name: Commit verified source changes only
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/apply_stage2_runtime_hardening.py
          git add scripts supervisor tests .gitignore README.md CHANGELOG.md docs references 2>/dev/null || true
          git restore --staged .plan-auditor 2>/dev/null || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden runtime concurrency audit and rollback'
          git push origin HEAD:hardening/full-root-fixes
