name: lint and types

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned linter and the package under test
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.9"
          python -m pip install .
      # The ratchet compares current per-rule counts against the recorded
      # baseline and fails only when a count rises. No rule is disabled and no
      # file is excluded, so the existing backlog stays visible and can only
      # shrink. Regenerate deliberately with --write-baseline.
      - name: Ruff ratchet (fail on any new finding)
        run: python .github/scripts/quality_ratchet.py ruff

      - name: Confirm formatting is not drifting
        run: python -m ruff format --check .github/scripts conftest.py

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned type checker and the package under test
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy==2.4.0"
          python -m pip install .
      # --strict is the real gate. The repo is not yet clean under it, so the
      # ratchet holds the current per-error-code counts instead of disabling
      # checks. There is deliberately no ignore_errors anywhere: each finding
      # stays live and a new one fails the build.
      - name: mypy --strict ratchet (fail on any new finding)
        run: python .github/scripts/quality_ratchet.py mypy

  version-lockstep:
    name: version-lockstep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require one version across pyproject, runtime, npm, skill, citation and changelog
        run: python .github/scripts/check_version_lockstep.py