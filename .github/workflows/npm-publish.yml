name: npm Publish

on:
  workflow_dispatch:
    inputs:
      use_token_fallback:
        description: >-
          Publish with the NPM_TOKEN secret instead of OIDC trusted publishing.
          Token publishing cannot produce a provenance attestation. Only needed
          while no trusted publisher is registered on npmjs.com for this package.
        type: boolean
        required: false
        default: false
  # The same trigger the PyPI release uses, so one version bump updates both
  # registries and the two cannot drift apart. The previous version of this
  # workflow fired on any push touching package.json, which meant a documentation
  # edit could trigger a publish attempt against an already-published version.
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"

concurrency:
  group: npm-publish
  cancel-in-progress: false

# Read-only by default. The publish job opts into id-token only when it actually
# uses OIDC, so the token path never mints an attestation it will not use.
permissions:
  contents: read

jobs:
  verify:
    name: verify launcher before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships npm 11.x. Trusted publishing and `--provenance` need
          # npm >= 11.5.1 and Node >= 22.14.0; npm 10.x has neither and fails at
          # upload time rather than at startup. Node 20 was the wrong floor here.
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the package the launcher shells out to
        run: python -m pip install .
      - name: Report the toolchain used for this publish
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"
      # Every one of these gates exists because a defective build reached npm:
      # 2.4.0 shipped a JavaScript syntax error, and 2.4.1 shipped a launcher
      # that audited the installed package directory instead of the caller's.
      - name: Launcher syntax and contract tests
        run: npm test && npm run test:contract
      - name: Publish-mode contract tests
        run: npm run test:publish-modes
      # The consolidated pre-publish gate: it packs the tarball, checks the
      # allowlist against npm's own file list, installs it somewhere unrelated,
      # and runs the *installed* bin from a different working directory. This is
      # the same command `prepublishOnly` runs, so CI and the publish path cannot
      # diverge. It replaces `test:tarball` and `test:installed`, which each shelled
      # out to npm a second time and could die without a diagnostic.
      # Runs the gate from inside a real dry-run publish lifecycle, with the
      # project .npmrc that actions/setup-node writes. That combination is what
      # broke runs 37120521494 and 37129620610: npm emits an always-auth warning
      # on stderr there and nowhere else, so a direct invocation of the gate
      # cannot reproduce it.
      - name: Pre-publish gate lifecycle test (inside a dry-run publish)
        run: npm run test:lifecycle
      - name: Pre-publish gate (tarball contents + installed launcher)
        run: npm run test:gate
      - name: Require one version across every distribution surface
        run: python .github/scripts/check_version_lockstep.py

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # id-token mints the OIDC attestation npm trusts. Granted unconditionally
      # so the job does not change shape between modes; the token path simply
      # does not use it.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Resolve the version from package.json
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"
      # Decide the publish mode once, up front, and fail closed here rather than
      # discovering a missing credential at upload time.
      #
      # A push to main carries no inputs, so use_token_fallback is empty and the
      # workflow resolves to "oidc". Dispatching with the checkbox forces "token".
      - name: Select the publish mode and validate its credential
        id: mode
        shell: bash
        env:
          USE_TOKEN_FALLBACK: ${{ inputs.use_token_fallback }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$USE_TOKEN_FALLBACK" = "true" ]; then
            mode="token"
          else
            mode="oidc"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "selected publish mode: $mode"

          if [ "$mode" = "token" ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::use_token_fallback was requested but the NPM_TOKEN secret is empty."
              echo "::error::Add an npm automation token with publish scope, or dispatch with the checkbox off to use OIDC trusted publishing."
              exit 1
            fi
            echo "using the NPM_TOKEN secret; this path publishes WITHOUT --provenance"
            echo "because a registry token cannot mint an attestation"
          else
            echo "using OIDC trusted publishing with --provenance"
            echo "if this fails with E404, no trusted publisher is registered on npmjs.com"
            echo "for Furox-Art/plan-auditor / npm-publish.yml / npm; dispatch with"
            echo "use_token_fallback=true to publish with NPM_TOKEN instead"
          fi
      # Numeric semver comparison, not a regex. A pattern like
      # ^11\.(5[1-9]|[6-9][0-9])\.|^1[2-9]\. is wrong: [6-9][0-9] does not
      # match 11.19.0's minor 19 only by luck of how the alternation is read,
      # and the 1[2-9] branch depends on the same accident. Comparing parsed
      # numbers states the floor directly.
      - name: Require an npm version that supports trusted publishing
        if: steps.mode.outputs.mode == 'oidc'
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { execSync } = require("child_process");
            const raw = execSync("npm --version", { encoding: "utf8" }).trim();
            const MIN = [11, 5, 1];
            const parse = (v) => {
              const core = v.split("-")[0].split(".").map((n) => parseInt(n, 10));
              return [core[0] || 0, core[1] || 0, core[2] || 0];
            };
            const [major, minor, patch] = parse(raw);
            const atLeast =
              major > MIN[0] ||
              (major === MIN[0] &&
                (minor > MIN[1] || (minor === MIN[1] && patch >= MIN[2])));
            console.log(`npm ${raw}, required >= ${MIN.join(".")}`);
            if (!atLeast) {
              console.error(
                `npm ${raw} is too old for trusted publishing. ` +
                  `Node 24 ships npm 11.x; npm >= ${MIN.join(".")} is required.`
              );
              process.exit(1);
            }
          '
      - name: Refuse to publish a version that already exists
        id: gate
        shell: bash
        run: |
          # npm versions are immutable, so republishing is an E403 failure. This
          # turns a no-op push into a green skip instead of a red build.
          if npm view "plan-auditor@${{ steps.meta.outputs.version }}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "plan-auditor@${{ steps.meta.outputs.version }} is already on npm; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Publishes from the checked-out source, not from a locally installed copy,
      # so the tarball is built from exactly the reviewed commit. --provenance
      # binds the upload to this workflow run via the OIDC token minted above.
      - name: Publish to npm with trusted publishing
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'oidc'
        run: npm publish --access public --provenance
      # Explicit opt-in token path. Deliberately no --provenance: npm would fail
      # the publish rather than silently publish without an attestation, and a
      # token cannot produce one. This replaces the previous unconditional
      # fallback, which ran automatically after any trusted-publishing failure
      # and so could downgrade a release to an unattested upload without anyone
      # asking for it.
      - name: Publish to npm with the NPM_TOKEN secret
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.mode == 'token'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # No continue-on-error anywhere: a publish that silently fails is worse than
      # a red build, because it leaves the registry and the repository disagreeing
      # about what is released.
      - name: Require the published version to be readable from the registry
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          published="$(npm view "plan-auditor@${{ steps.meta.outputs.version }}" version 2>/dev/null || true)"
          if [ "$published" != "${{ steps.meta.outputs.version }}" ]; then
            echo "ERROR: npm reports '${published:-nothing}', expected ${{ steps.meta.outputs.version }}"
            exit 1
          fi
          echo "npm registry confirms plan-auditor@$published"