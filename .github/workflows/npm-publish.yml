name: npm Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "index.js"
      - "bin/plan-auditor.js"
      - "bin/launcher_contract.test.js"
      - "pyproject.toml"

concurrency:
  group: npm-publish
  cancel-in-progress: false

# Read-only: publishing to npm needs a registry token, never repository write.
permissions:
  contents: read

jobs:
  verify:
    name: verify launcher before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the package the launcher shells out to
        run: python -m pip install .
      # This gate did not exist before: v2.4.0 was published with a JavaScript
      # syntax error, so `npx plan-auditor` could not run at all.
      - name: Launcher syntax and contract tests
        run: npm test && npm run test:contract
      - name: Confirm the packed tarball ships only allowlisted files
        run: npm run test:tarball

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Resolve the version from package.json
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"
      # npm republishing an existing version fails with E403, which made a
      # no-op push to main a red build. The Python distribution gates the same
      # way; this keeps the two registries consistent.
      - name: Check whether the version is already published
        id: gate
        shell: bash
        run: |
          if npm view "plan-auditor@${{ steps.meta.outputs.version }}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "plan-auditor@${{ steps.meta.outputs.version }} is already on npm; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No continue-on-error: a failed publish must fail the job rather than be
      # reported as a successful release.
      - name: Publish to npm
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Confirm the published version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          published="$(npm view "plan-auditor@${{ steps.meta.outputs.version }}" version)"
          if [ "$published" != "${{ steps.meta.outputs.version }}" ]; then
            echo "ERROR: npm reports $published, expected ${{ steps.meta.outputs.version }}"
            exit 1
          fi
          echo "npm registry confirms plan-auditor@$published"