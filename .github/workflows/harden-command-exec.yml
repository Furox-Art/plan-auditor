name: one-shot command execution hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-command-exec.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply safe command execution hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit_check.py')
          text = path.read_text(encoding='utf-8')

          old = "import re\nimport subprocess\n"
          new = "import re\nimport shlex\nimport subprocess\n"
          if text.count(old) != 1:
              raise SystemExit('expected import anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            if kind in ("run", "exec") and not check.get("cmd"):\n                errs.append("adım %s: %s kontrolü 'cmd' ister" % (sid, kind))\n'''
          new = '''            if kind in ("run", "exec"):\n                cmd = check.get("cmd")\n                argv = check.get("argv")\n                has_cmd = isinstance(cmd, str) and bool(cmd.strip())\n                has_argv = (\n                    isinstance(argv, list) and bool(argv)\n                    and all(isinstance(arg, str) and bool(arg) for arg in argv)\n                )\n                if not (has_cmd or has_argv):\n                    errs.append(\n                        "adım %s: %s kontrolü boş olmayan 'cmd' string veya 'argv' listesi ister"\n                        % (sid, kind)\n                    )\n                if "argv" in check and not has_argv:\n                    errs.append("adım %s: %s argv boş olmayan string listesi olmalı" % (sid, kind))\n                if "shell" in check and not isinstance(check.get("shell"), bool):\n                    errs.append("adım %s: %s shell boolean olmalı" % (sid, kind))\n                if check.get("shell") is True and has_argv:\n                    errs.append("adım %s: %s shell=true ile argv birlikte kullanılamaz" % (sid, kind))\n'''
          if text.count(old) != 1:
              raise SystemExit('expected validation anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    if check["type"] == "exec":\n        return {\n            "type": "run",\n            "cmd": check["cmd"],\n            "expect_exit": check.get("expect_exit", 0),\n        }\n'''
          new = '''    if check["type"] == "exec":\n        normalized = {\n            "type": "run",\n            "expect_exit": check.get("expect_exit", 0),\n        }\n        if "argv" in check:\n            normalized["argv"] = list(check["argv"])\n        else:\n            normalized["cmd"] = check["cmd"]\n        if check.get("shell") is True:\n            normalized["shell"] = True\n        for key in ("timeout", "output_regex"):\n            if key in check:\n                normalized[key] = check[key]\n        return normalized\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exec normalization anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''def run_check(check, base, timeout=300):\n    """Return ``(passed, detail, output_tail)``."""\n    kind = check["type"]\n    if kind == "run":\n        try:\n            proc = subprocess.run(\n                check["cmd"], shell=True, cwd=base, capture_output=True,\n                text=True, timeout=check.get("timeout", timeout),\n            )\n        except subprocess.TimeoutExpired:\n            return False, "komut zaman aşımına uğradı", ""\n'''
          new = '''def _command_spec(check):\n    """Return ``(command, use_shell)`` with shell disabled by default.\n\n    ``argv`` is the preferred, cross-platform form. Legacy ``cmd`` strings are\n    parsed with ``shlex`` and executed directly. Shell interpretation is only\n    enabled when a plan explicitly sets ``shell: true``.\n    """\n    if "argv" in check:\n        argv = check.get("argv")\n        if not isinstance(argv, list) or not argv or not all(\n            isinstance(arg, str) and bool(arg) for arg in argv\n        ):\n            raise ValueError("argv boş olmayan string listesi olmalı")\n        if check.get("shell") is True:\n            raise ValueError("shell=true ile argv birlikte kullanılamaz")\n        return list(argv), False\n\n    cmd = check.get("cmd")\n    if not isinstance(cmd, str) or not cmd.strip():\n        raise ValueError("cmd boş olmayan string olmalı")\n    if check.get("shell") is True:\n        return cmd, True\n    try:\n        argv = shlex.split(cmd, posix=True)\n    except ValueError as exc:\n        raise ValueError("cmd ayrıştırılamadı: %s" % exc) from exc\n    if not argv:\n        raise ValueError("cmd boş komuta dönüştü")\n    return argv, False\n\n\ndef run_check(check, base, timeout=300):\n    """Return ``(passed, detail, output_tail)``."""\n    kind = check["type"]\n    if kind == "run":\n        try:\n            command, use_shell = _command_spec(check)\n            proc = subprocess.run(\n                command, shell=use_shell, cwd=base, capture_output=True,\n                text=True, timeout=check.get("timeout", timeout),\n            )\n        except subprocess.TimeoutExpired:\n            return False, "komut zaman aşımına uğradı", ""\n        except (OSError, ValueError) as exc:\n            return False, "komut başlatılamadı: %s" % exc, ""\n'''
          if text.count(old) != 1:
              raise SystemExit('expected run_check anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            proc = subprocess.run(\n                "git ls-files", shell=True, cwd=base, capture_output=True,\n                text=True, timeout=60,\n            )\n'''
          new = '''            proc = subprocess.run(\n                ["git", "ls-files"], shell=False, cwd=base, capture_output=True,\n                text=True, timeout=60,\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('expected snapshot git anchor not found exactly once')
          text = text.replace(old, new, 1)

          if 'shell=True' in text:
              raise SystemExit('unrestricted literal shell=True remains in audit core')
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_audit_check.py')
          t = tests.read_text(encoding='utf-8')
          anchor = '''def test_run_check_output_regex(tmp_path):\n    ok, _, _ = ac.run_check(\n        {"type": "run", "cmd": "python -c \\\"print('TOTAL: 42')\\\"",\n         "output_regex": r"TOTAL:\\s+\\d+"},\n        str(tmp_path))\n    assert ok\n    ok, _, _ = ac.run_check(\n        {"type": "run", "cmd": "python -c \\\"print('hayır')\\\"",\n         "output_regex": r"TOTAL:\\s+\\d+"},\n        str(tmp_path))\n    assert not ok\n\n\n'''
          addition = '''def test_run_check_argv_executes_without_shell(tmp_path):\n    marker = tmp_path / "marker.txt"\n    ok, _, output = ac.run_check(\n        {"type": "run", "argv": [sys.executable, "-c", "print('ARGV_OK')"]},\n        str(tmp_path),\n    )\n    assert ok and "ARGV_OK" in output\n    assert not marker.exists()\n\n\ndef test_run_check_legacy_cmd_does_not_interpret_shell_metacharacters(tmp_path):\n    marker = tmp_path / "marker.txt"\n    cmd = f'{sys.executable} -c "print(\'SAFE\')" > {marker.name}'\n    ok, _, output = ac.run_check({"type": "run", "cmd": cmd}, str(tmp_path))\n    assert ok\n    assert "SAFE" in output\n    assert not marker.exists()\n\n\ndef test_run_check_shell_requires_explicit_opt_in(tmp_path):\n    marker = tmp_path / "marker.txt"\n    ok, _, _ = ac.run_check(\n        {"type": "run", "cmd": f"echo shell-ok > {marker.name}", "shell": True},\n        str(tmp_path),\n    )\n    assert ok\n    assert marker.read_text(encoding="utf-8").strip() == "shell-ok"\n\n\ndef test_validate_accepts_structured_argv_and_rejects_shell_argv_mix():\n    plan = valid_plan(verify=[\n        {"type": "run", "argv": [sys.executable, "-c", "print(1)"]}\n    ])\n    assert ac.validate_plan(plan) == []\n    plan["steps"][0]["verify"][0]["shell"] = True\n    errs = ac.validate_plan(plan)\n    assert any("shell=true" in err for err in errs)\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('expected test insertion anchor not found exactly once')
          t = t.replace(anchor, anchor + addition, 1)
          tests.write_text(t, encoding='utf-8')

          docs = Path('references/plan-format.md')
          d = docs.read_text(encoding='utf-8')
          section = '''\n## Command execution safety\n\nBehavioral checks disable shell interpretation by default. Prefer structured\n`argv` for exact, cross-platform execution, for example:\n\n```json\n{"type":"run","argv":["python","-m","pytest","tests/","-q"],"expect_exit":0}\n```\n\nLegacy `cmd` strings remain supported, but are parsed into an argument vector\nand executed without a shell. Shell operators such as `>`, `&&`, pipes, globbing,\nand variable expansion are therefore inert unless the check explicitly sets\n`"shell": true`. Shell mode is an explicit trust-boundary opt-in and cannot be\ncombined with `argv`.\n'''
          if '## Command execution safety' not in d:
              d = d.rstrip() + '\n' + section
          docs.write_text(d, encoding='utf-8')
          PY
      - name: Install and run full regression suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest tests/ -q
          python -m pytest examples/fib/test_fib.py -q
      - name: Run integrated dogfood gate
        run: |
          plan-auditor plan verify .
          plan-auditor audit .
      - name: Commit hardened implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-command-exec.yml
          git add scripts/audit_check.py tests/test_audit_check.py references/plan-format.md
          git commit -m "Harden command execution against implicit shell use"
          git push
