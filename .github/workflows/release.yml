name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"

# One trigger, two registries. npm-publish.yml watches the same
# .github/pypi-release-trigger path, so a single version bump publishes to PyPI
# and npm together. The groups are deliberately separate so a slow PyPI upload
# cannot cancel an npm publish or the other way round.
concurrency:
  group: pypi-release
  cancel-in-progress: false

# Read-only by default. Two jobs need more, and each asks for exactly what it
# uses: `publish` needs `id-token` for the OIDC attestation, `github-release`
# needs `contents` to write the tag and release. A job-level `permissions` block
# replaces this one for that job, so neither grant widens the other.
permissions:
  contents: read

jobs:
  package-preflight:
    name: release-preflight
    # workflow_dispatch can target any branch; the release path is main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package, tests, and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m pip install . pytest
      - name: Require one version across every source
        run: python .github/scripts/check_version_lockstep.py
      - name: Run full regression suite
        run: python -m pytest tests/ -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Assert wheel and sdist ship the documented assets
        run: python .github/scripts/check_dist_assets.py

  wheel-preflight:
    name: release-wheel-cli-smoke (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build real wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
      - name: Install wheel in clean venv and run full CLI smoke
        run: python tests/wheel_cli_smoke.py --wheel-dir dist

  publish:
    name: publish to PyPI
    needs: [package-preflight, wheel-preflight]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protects the `pypi` environment. Required reviewers are deliberately not
    # enabled: this is a single-maintainer repository, so a required reviewer
    # would block every release until a second person approves, which trades a
    # real safety property (human sign-off on a supply-chain artefact) for a
    # permanently stuck release train. The compensating controls are the `pypi`
    # deployment branch policy (main only), the version-existence gate below,
    # and OIDC trusted publishing, which means no long-lived API token exists
    # in repository secrets to leak.
    environment: pypi
    permissions:
      # id-token is what mints the OIDC attestation PyPI trusts.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      - name: Check whether version already exists on PyPI
        id: gate
        shell: bash
        run: |
          if curl --retry 3 --retry-delay 2 --retry-all-errors -sfL \
            "https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Previously both upload attempts set continue-on-error and the outcome
      # was judged afterwards, so a genuine upload failure could be swallowed
      # and the job could report success with nothing published. Any failure now
      # fails the job outright.
      - name: Build distributions
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install "build==1.6.1"
          python -m build
      - name: Publish to PyPI with trusted publishing
        id: trusted_publish
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      # No token fallback. The 2.6.3 artifacts carry a PEP 740 attestation, which
      # only the OIDC trusted publisher can mint, so the trusted path is known to
      # work and a long-lived PYPI_API_TOKEN has no job left to do. A failed OIDC
      # upload must fail the release instead of quietly downgrading to a token.
      - name: Wait for PyPI propagation
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          json_url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          simple_url="https://pypi.org/simple/${{ steps.meta.outputs.name }}/"
          version="${{ steps.meta.outputs.version }}"

          # The upload action returning is not the version being readable. Poll
          # both public indexes over five minutes; a version that never appears
          # fails the release instead of reporting a green run for an upload
          # nobody can install.
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$json_url" > /dev/null; then
              echo "PyPI JSON endpoint sees ${version} on attempt ${attempt}."
              exit 0
            fi
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$simple_url" | grep -Fq "$version"; then
              echo "PyPI simple index sees ${version} on attempt ${attempt}."
              exit 0
            fi
            sleep 15
          done

          echo "::error::PyPI accepted the upload, but neither public index serves ${version} after 5 minutes."
          exit 1

  # Split out of the `publish` job so that the only job holding `contents: write`
  # is the one that needs it. Runs 37075003605 and 37165300933 uploaded to PyPI
  # successfully and then failed the release run on this step:
  #
  #   ##[error]Resource not accessible by integration
  #     .../releases#generate-release-notes-content-for-a-release
  #
  # `softprops/action-gh-release` writes a tag and a release through the REST API,
  # which needs `contents: write`. The publish job cannot have it: that job's only
  # write scope is `id-token`, for the OIDC attestation, and widening it would
  # hand write access to the job that uploads the supply-chain artifact. `needs:
  # publish` keeps the ordering, so a release is never announced for a version
  # that did not upload.
  github-release:
    name: create GitHub release
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      # Gated on the GitHub release itself, not on the PyPI gate: a version can be
      # on PyPI while its release is missing (2.6.2 shipped that way). At this
      # action SHA, updating an existing release with generate_release_notes
      # appends a second copy of the notes, so an existing release is left alone.
      - name: Check whether the GitHub release already exists
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>&1); then
            echo "GitHub release ${TAG} already exists (id ${out}); leaving it untouched."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine whether ${TAG} exists: ${out}"
            exit 1
          fi
      - name: Create GitHub release
        if: steps.release_gate.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true