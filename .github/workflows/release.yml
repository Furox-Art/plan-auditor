name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package, tests, and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build twine
      - name: Run full regression suite
        run: python -m pytest tests/ -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*

  wheel-preflight:
    name: release-wheel-cli-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build real wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
      - name: Install wheel in clean venv and run full CLI smoke
        run: python tests/wheel_cli_smoke.py --wheel-dir dist

  publish:
    needs: [package-preflight, wheel-preflight]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      - name: Check whether version already exists on PyPI
        id: gate
        shell: bash
        run: |
          if curl --retry 3 --retry-delay 2 --retry-all-errors -sfL \
            "https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect API token fallback
        id: auth
        if: steps.gate.outputs.skip != 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"; else echo "has_token=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build distributions
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI with trusted publishing
        id: trusted_publish
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
      - name: Publish to PyPI with API token fallback
        id: token_publish
        if: steps.gate.outputs.skip != 'true' && steps.trusted_publish.outcome != 'success' && steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
      - name: Require successful PyPI upload
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          trusted="${{ steps.trusted_publish.outcome }}"
          token="${{ steps.token_publish.outcome }}"
          if [ "$trusted" = "success" ] || [ "$token" = "success" ]; then
            echo "PyPI upload action succeeded."
            exit 0
          fi
          echo "PyPI upload failed. Trusted publishing outcome: $trusted"
          echo "PyPI upload failed. Token fallback outcome: $token"
          exit 1
      - name: Wait for PyPI propagation
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          json_url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          simple_url="https://pypi.org/simple/${{ steps.meta.outputs.name }}/"
          version="${{ steps.meta.outputs.version }}"

          # A successful upload action is authoritative. Public indexes can lag,
          # so propagation is retried for observability without creating a false
          # red release after the artifact was accepted by PyPI.
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$json_url" > /dev/null; then
              echo "PyPI JSON endpoint sees ${version} on attempt ${attempt}."
              exit 0
            fi
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$simple_url" | grep -Fq "$version"; then
              echo "PyPI simple index sees ${version} on attempt ${attempt}."
              exit 0
            fi
            sleep 15
          done

          echo "::warning::PyPI upload succeeded, but public indexes have not propagated yet."
          exit 0
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
