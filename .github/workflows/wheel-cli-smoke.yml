name: wheel CLI smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-cli-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-cli-smoke:
    name: wheel-cli-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel from source checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
      - name: Install wheel into fresh venv and exercise real CLI
        run: python tests/wheel_cli_smoke.py --wheel-dir dist