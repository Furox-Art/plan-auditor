name: Determinism matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: ${{ matrix.os }} determinism matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run determinism matrix
        run: >
          python tests/tools/determinism_matrix.py run
          --workload tests/tools/determinism_workload.py
          --out determinism-manifest-${{ matrix.os }}.json
          --seeds 0 12345 random
          --threads 1 4
          --gate within-host
      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: determinism-manifest-${{ matrix.os }}
          path: determinism-manifest-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Cross-OS digest comparison (report only)
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: determinism-manifest-*
          merge-multiple: true
          path: manifests
      - name: Compare manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(manifests/*.json)
          printf 'manifest files: %s\n' "${#files[@]}"
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              left=$(basename "${files[$i]}" .json)
              right=$(basename "${files[$j]}" .json)
              echo "=== ${left} vs ${right} ==="
              python tests/tools/determinism_matrix.py compare \
                "${files[$i]}" "${files[$j]}" > "compare-${left}-${right}.json"
            done
          done
      - name: Write comparison summary
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          rows = ["| baseline | candidate | shared | identical | mismatches |",
                  "| --- | --- | --- | --- | --- |"]
          for path in sorted(glob.glob("compare-*.json")):
              data = json.load(open(path, encoding="utf-8"))
              rows.append(
                  f"| {data['baseline_host']['system']} | "
                  f"{data['candidate_host']['system']} | "
                  f"{data['shared_variants']} | {data['identical']} | "
                  f"{len(data['mismatches'])} |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Cross-OS determinism\n\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          PY
