name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supervisor/**"
      - "scripts/**"
      - "tests/fuzz/**"
      - "pyproject.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-plan-auditor
  cancel-in-progress: true

jobs:
  fuzz:
    name: Atheris
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Atheris
        run: python -m pip install atheris==3.1.0
      - name: Install plan-auditor
        run: python -m pip install -e .
      - name: Fuzz the plan graph validator
        run: python tests/fuzz/fuzz_plan_graph.py -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
