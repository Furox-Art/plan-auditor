name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned build tooling and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m pip install .
      - name: Build both distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      # twine check only inspects metadata. This asserts the artifacts actually
      # contain the runtime modules and the skill assets the README and docs
      # tell users to copy, which nothing else covers.
      - name: Assert wheel and sdist ship the documented assets
        run: python .github/scripts/check_dist_assets.py
      - name: Install the built wheel in a clean environment and exercise the CLI
        run: python tests/wheel_cli_smoke.py --wheel-dir dist

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the documentation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.6.14"
      # --strict turns broken links and missing nav targets into build errors,
      # so a docs regression fails CI instead of shipping.
      - name: Build the documentation site strictly
        run: python -m mkdocs build --strict

  npm-launcher:
    name: npm-launcher
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the package the launcher shells out to
        run: python -m pip install .
      # node --check plus the behavioural contract: exit-code propagation,
      # caller-cwd resolution, and the tarball allowlist.
      - name: Launcher syntax and contract tests
        run: npm test && npm run test:contract
- name: Confirm the packed tarball ships only allowlisted files
        run: |
          npm pack --dry-run --json > pack.json
          node bin/check_tarball_contents.js pack.json