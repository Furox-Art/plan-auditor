name: apply dependency graph hardening

on:
  push:
    branches: [hardening/plan-dependency-graph]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/plan-dependency-graph
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch dependency graph runtime
        run: python .github/patch_dependency_graph.py
      - name: Run full regression suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest tests/ -q
          python -m pytest examples/fib/test_fib.py -q
      - name: Dogfood integrated final gate
        run: |
          plan-auditor plan verify .
          plan-auditor audit .
          plan-auditor doctor . > /tmp/doctor.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/doctor.json'))
          assert data['assessment']['outcome'] == 'PASS'
          assert data['assessment']['plan']['topological_order']
          assert data['assessment']['fresh_audit']['valid'] is True
          PY
      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dependency-graph.yml .github/patch_dependency_graph.py
          git add scripts/audit_check.py supervisor/orchestrator.py supervisor/cli.py CHANGELOG.md
          git commit -m "Enforce plan dependency graph and output contracts"
          git push
